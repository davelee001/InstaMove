name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run syntax and test checks
        run: npm run check
      - name: Audit high-severity dependencies
        run: npm run audit:high

  windows-bluetooth-build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile native Windows GATT helper
        run: dotnet publish native/windows-bluetooth/InstaMove.Bluetooth.csproj -c Release -o native/windows-bluetooth/publish
